name: APK Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rodada-brutal-apk
          path: android/build/outputs/apk/debug/android-debug.apk

      - name: Preparar APK
        run: cp android/build/outputs/apk/debug/android-debug.apk RodadaBrutal.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: "Rodada Brutal (última versión)"
          body: |
            Toca **RodadaBrutal.apk** para descargar e instalar el juego.
            (Si Android pregunta, permití instalar apps de este origen.)
          prerelease: true
          make_latest: true
          files: RodadaBrutal.apk
