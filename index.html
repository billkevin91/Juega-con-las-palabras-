<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pipo y las Palabras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Concepto: concurso espacial de ortografía. Fondo de cosmos, tarjeta de juego al centro, presentador Pipo arriba y el saboteador Borrón que aparece cuando algo sale mal. Un solo ambiente oscuro a propósito. */
:root{
  --space:#150f3a; --space2:#241b5e; --card:#2b2270; --ink:#f6f1ff; --muted:#b9b0ec; --line:#44399a;
  --sun:#ffc93c; --berry:#ff6b8b; --sky:#4cc3ff; --leaf:#5ed38b; --grape:#a98bff; --orange:#ff9f4a;
  --on-color:#1b1448; --good:#5ed38b; --bad:#ff8087;
  --paper:#fff4cf; --paper-ink:#4a3200; --gold:#d69a00;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--space);
  background-image:
    radial-gradient(1.6px 1.6px at 8% 12%,rgba(255,255,255,.85),transparent),
    radial-gradient(1.2px 1.2px at 22% 64%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.8px 1.8px at 41% 28%,rgba(255,255,255,.8),transparent),
    radial-gradient(1.2px 1.2px at 63% 82%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.6px 1.6px at 78% 18%,rgba(255,255,255,.85),transparent),
    radial-gradient(1.2px 1.2px at 91% 55%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.4px 1.4px at 54% 46%,rgba(255,255,255,.5),transparent),
    linear-gradient(var(--space),var(--space2));
  color:var(--ink);font-family:var(--font-body);font-size:16px;min-height:100%;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1;margin:0;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);font-weight:700}
.top{display:flex;align-items:center;gap:12px}
.av{flex:none;width:84px;height:84px}
.av svg{width:100%;height:100%;overflow:visible}
.top .sv-b{display:none}
.top.blot .sv-p{display:none}
.top.blot .sv-b{display:block}
.av.happy{animation:hop .7s ease}
.av.sad{animation:wob .5s ease}
.m-open,.m-sad{display:none}
.av.happy .m-smile,.av.sad .m-smile{display:none}
.av.happy .m-open{display:block}
.av.sad .m-sad{display:block}
.sv-b{overflow:visible}
.sv-b .bl-body{transform-box:fill-box;transform-origin:50% 100%;animation:blobidle 2.8s ease-in-out infinite}
@keyframes blobidle{0%,100%{transform:scale(1,1)}40%{transform:scale(.96,1.05) translateY(-3px)}70%{transform:scale(1.05,.95)}}
.sv-b .bl-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sv-b .bl-pupils{animation:look 5s ease-in-out infinite}
@keyframes look{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.5px,-1px)}50%{transform:translate(2.5px,1px)}75%{transform:translate(0,-2px)}}
.sv-b .bl-brows{animation:brow 3.4s ease-in-out infinite}
@keyframes brow{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.sv-b .bl-sh{transform-box:fill-box;transform-origin:center;animation:shpulse 2.8s ease-in-out infinite}
@keyframes shpulse{50%{transform:scale(.85);opacity:.15}}
.sv-b .dr{transform-box:fill-box;transform-origin:center;animation:drip 2.6s ease-in infinite}
.sv-b .d2{animation-delay:.9s}.sv-b .d3{animation-delay:1.7s}
@keyframes drip{0%{transform:translateY(-4px) scale(.2);opacity:0}20%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(20px);opacity:0}}
.bm-laugh,.bm-sad{display:none}
.av.happy .bm-grin,.av.sad .bm-grin{display:none}
.av.happy .bm-laugh{display:block}
.av.sad .bm-sad{display:block}
.av.happy .bl-body{animation:blobidle .35s ease-in-out infinite}
.av.sad .bl-body{animation:none;transform:scale(1.04,.88)}
.av.sad .bl-brows{transform:translateY(4px)}
.top.blot .av.happy{animation:laugh .9s ease}
.top.blot .av.sad{animation:none}
@keyframes laugh{0%,100%{transform:translateY(0) rotate(0)}15%{transform:translateY(-8px) rotate(-6deg)}30%{transform:translateY(0) rotate(5deg)}45%{transform:translateY(-6px) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}80%{transform:translateY(-3px)}}
.sv-b.enter{animation:blotin .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes blotin{0%{transform:translateX(70px) scale(.2) rotate(30deg);opacity:0}60%{opacity:1}100%{transform:none}}
.sv-p.enter{animation:pipoin .5s ease}
@keyframes pipoin{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:none}}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:8px 14px 10px;font-weight:800;flex:1;min-width:0}
.bubble small{display:block;color:var(--sun);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top.blot .bubble small{color:var(--berry)}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.card{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.menu{display:grid;gap:12px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;border:2px solid var(--line);background:var(--card);transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.mode b{font-family:var(--font-display);font-size:21px;display:block;line-height:1.1}
.mode .d{color:var(--muted);font-size:14.5px;font-weight:700}
.mode .txt{min-width:0;flex:1}
.mode .st{flex:none;display:flex;gap:2px}
.planet{--sz:56px;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,var(--p1),var(--p2))}
.planet.ring::after{content:"";position:absolute;left:-30%;right:-30%;top:40%;height:20%;border:3px solid var(--p1);border-radius:50%;transform:rotate(-18deg);opacity:.9}
.planet.blotp{background:radial-gradient(circle at 32% 28%,#6b57d6,#2a1f78)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .mode{flex-direction:column;text-align:center;padding:16px 10px;gap:10px}
.grid .mode .st{justify-content:center}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.progress{display:flex;gap:6px;width:100%;justify-content:center}
.dot{flex:1;max-width:56px;height:10px;border-radius:6px;background:var(--line)}
.dot.done{background:var(--leaf)} .dot.now{background:var(--sun)}
.pic{width:132px;height:132px;border-radius:50%;background:var(--space2);border:4px solid var(--sun);display:grid;place-items:center;font-size:72px;line-height:1;font-family:var(--font-display);font-weight:800;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot,.tile,.opt{font-family:var(--font-display);font-weight:800}
.slot{width:48px;height:58px;border-radius:14px;border:3px dashed var(--muted);display:grid;place-items:center;font-size:30px;text-transform:uppercase}
.slot.sm{width:36px;height:44px;font-size:22px}
.slot.filled{border:3px solid var(--leaf);background:var(--leaf);color:var(--on-color)}
.slot.no{border:3px solid #7a4a86;background:#7a4a86;color:var(--ink)}
.slot.gap{border-color:var(--berry);color:var(--berry)}
.tile,.opt{all:unset;box-sizing:border-box;cursor:pointer;min-width:54px;height:58px;padding:0 14px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--on-color);box-shadow:0 5px 0 rgba(0,0,0,.3);text-transform:uppercase;transition:transform .08s}
.tile:active,.opt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tile.used{visibility:hidden}
.opt.word{font-size:24px;min-width:118px;text-transform:none}
.opt.right{outline:4px solid var(--good)} .opt.no{outline:4px solid var(--bad)}
.shake{animation:wob .4s}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid var(--line);font-weight:800;color:var(--ink);background:var(--space2)}
.ghost svg{width:20px;height:20px;fill:currentColor}
.primary{background:var(--berry);border-color:var(--berry);color:#fff}
.stars{display:flex;gap:6px}
.stars svg{width:60px;height:60px}
.score{font-weight:800;color:var(--muted);text-align:center}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.key{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:44px;border-radius:10px;background:var(--line);color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px}
.key.acc{background:#5b3f9e}
.key.good{background:var(--leaf);color:var(--on-color)}
.key.bad{background:var(--space);color:var(--muted);opacity:.55}
.pads{display:flex;gap:4px}
.pad{width:36px;height:18px;fill:var(--leaf)} .pad.off{fill:var(--line);opacity:.5}
.sea{position:relative;width:100%;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:18px 10px;min-height:150px;border-radius:22px;background:linear-gradient(rgba(76,195,255,.04),rgba(76,195,255,.2))}
.amb-w{position:absolute;inset:0;overflow:hidden;border-radius:22px;pointer-events:none}
.amb{position:absolute;bottom:-14px;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 60%);animation:ambrise var(--t) linear var(--d) infinite}
@keyframes ambrise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}50%{transform:translate(9px,-110px)}100%{transform:translate(-7px,-230px);opacity:0}}
.bub{all:unset;box-sizing:border-box;position:relative;cursor:pointer;width:116px;height:116px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center;color:var(--ink);animation:rise .9s cubic-bezier(.2,1.3,.4,1) var(--d) backwards,drift var(--t) ease-in-out calc(var(--d) + .9s) infinite alternate}
.bub .sk{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:radial-gradient(circle at 50% 50%,rgba(76,195,255,.08) 52%,rgba(255,120,200,.3) 80%,rgba(120,255,220,.4) 100%);box-shadow:inset 0 0 14px rgba(255,255,255,.25),0 0 14px rgba(76,195,255,.25);animation:squish calc(var(--t) * .8) ease-in-out var(--dr) infinite}
.bub .sk::before{content:"";position:absolute;left:16%;top:12%;width:34%;height:20%;border-radius:50%;background:rgba(255,255,255,.78);transform:rotate(-28deg)}
.bub .sk::after{content:"";position:absolute;right:16%;bottom:14%;width:13%;height:13%;border-radius:50%;background:rgba(255,255,255,.45)}
.bub .in{position:relative;display:block;padding:6px;overflow-wrap:anywhere;text-shadow:0 1px 3px rgba(0,0,0,.55);transition:transform .2s}
.bub:hover .in{transform:scale(1.08)}
.bub:hover .sk{filter:brightness(1.2)}
@keyframes rise{from{transform:translateY(80px) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes drift{0%{transform:translate(0,0)}33%{transform:translate(10px,-9px)}66%{transform:translate(-8px,-3px)}100%{transform:translate(4px,9px)}}
@keyframes squish{0%,100%{transform:scale(1,1);border-radius:50%}25%{transform:scale(1.05,.96);border-radius:48% 52% 50% 50%}50%{transform:scale(.97,1.04);border-radius:52% 48% 52% 48%}75%{transform:scale(1.03,.97);border-radius:50% 50% 47% 53%}}
.bub.pop{pointer-events:none}
.bub.pop .sk{animation:burst .35s ease-out forwards}
.bub.pop .in{animation:wordup .6s ease-out forwards}
@keyframes burst{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1.35);opacity:0}}
@keyframes wordup{0%{transform:scale(1);opacity:1;color:var(--good)}100%{transform:translateY(-26px) scale(1.2);opacity:0;color:var(--good)}}
.bub .drop{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none;animation:spray .6s ease-out forwards}
@keyframes spray{from{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}to{transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) scale(.2);opacity:0}}
.bub .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.9);pointer-events:none;animation:ringout .5s ease-out forwards}
@keyframes ringout{from{transform:scale(.9);opacity:1}to{transform:scale(1.7);opacity:0}}
.bub.gone{cursor:default}
.bub.gone .sk{animation:deflate .6s ease-out forwards}
.bub.gone .in{opacity:.35;transform:scale(.8)}
@keyframes deflate{0%{transform:scale(1)}20%{transform:scale(1.08,.9)}40%{transform:scale(.9,1.08)}100%{transform:scale(.62);opacity:.25}}





.ans{font:800 26px var(--font-display);width:100%;max-width:340px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--space);color:var(--ink);text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--font-display);font-weight:800;font-size:20px}
.hearts{color:var(--berry);letter-spacing:2px}
.tbar{width:100%;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--sun);transition:width .1s linear}
.combo{min-height:22px;color:var(--sun);font-weight:800}
.ink{position:absolute;z-index:2;background:#0b0824;border-radius:46% 54% 40% 60%/55% 45% 55% 45%;pointer-events:none;opacity:.9}
.ink::before{content:"";position:absolute;width:24%;height:24%;right:-14%;top:6%;background:inherit;border-radius:50%}
.ink::after{content:"";position:absolute;width:14%;height:42%;left:32%;top:82%;background:inherit;border-radius:0 0 50% 50%;transform-origin:top}
.ink.new{animation:splat .5s cubic-bezier(.2,1.5,.4,1) backwards}
.ink.new::after{animation:dripgrow 2.4s ease-in .3s backwards}
@keyframes splat{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:.9}}
@keyframes dripgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.shot{position:fixed;left:0;top:0;z-index:50;width:26px;height:26px;border-radius:50%;background:#0b0824;box-shadow:0 0 0 2px #3a2b94;pointer-events:none}
.shot.trail{width:8px;height:8px;box-shadow:none}
.dip{background:var(--paper);color:var(--paper-ink);border:6px double var(--gold);border-radius:14px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dip .big{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.05}
.dip .nm{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,8vw,40px);border-bottom:3px solid var(--gold);padding:0 14px;overflow-wrap:anywhere}
.dip .meds{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-weight:800;font-size:14px}
.dip .meds span{display:flex;flex-direction:column;align-items:center;gap:2px}
.hint{color:var(--muted);text-align:center;margin:0;font-size:15px;font-weight:700}
form{display:contents}
/* Planeta Anfibia (Pantanal) */
.swamp{position:relative;width:100%;aspect-ratio:4/3;container-type:inline-size;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#12402f;user-select:none}
.swamp .bg{position:absolute;inset:0;width:100%;height:100%}
.swamp .medal{position:absolute;left:7.2%;top:20.8%;width:44px;width:11cqw;height:44px;height:11cqw;margin:-22px 0 0 -22px;margin:-5.5cqw 0 0 -5.5cqw;display:grid;place-items:center;font-size:28px;font-size:7cqw;line-height:1;z-index:3}
.swamp .lives{position:absolute;left:2cqw;top:2cqw;display:flex;gap:.6cqw;z-index:4}
.swamp .lv{width:24px;width:5.2cqw;height:auto;fill:#8ff04f;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.swamp .lv.off{fill:#2f4a3c;opacity:.6}
.swamp .signslots{position:absolute;left:50%;top:21.67%;transform:translate(-50%,-50%);display:flex;gap:.7cqw;justify-content:center;max-width:66cqw;z-index:3}
.swamp .sg{width:30px;width:5.6cqw;height:42px;height:8cqw;border-radius:1cqw;background:rgba(40,22,8,.7);border:.35cqw solid #2a1708;box-shadow:inset 0 .5cqw 1cqw rgba(0,0,0,.5);display:grid;place-items:center;font:800 24px var(--font-display);font-size:4.8cqw;color:#ffe9a6;text-transform:uppercase}
.swamp .sg.on{background:#fff3c4;color:#4a2c12;border-color:#e8b030;box-shadow:0 0 1.4cqw rgba(255,243,160,.8)}
.swamp .sg.on.pop{animation:sgpop .45s cubic-bezier(.2,1.5,.4,1)}
.swamp .sg.miss{background:#5a2a52;color:#ffb3da;border-color:#8a4a7a}
@keyframes sgpop{0%{transform:scale(.4) rotate(-12deg)}100%{transform:none}}
.swamp .padb{all:unset;box-sizing:border-box;position:absolute;left:var(--x);top:var(--y);width:44px;width:8.6cqw;height:36px;height:7cqw;margin:-18px 0 0 -22px;margin:-3.5cqw 0 0 -4.3cqw;cursor:pointer;z-index:3}
.swamp .padb .bob{position:absolute;inset:0;animation:padbob var(--t) ease-in-out var(--d) infinite alternate}
.swamp .padb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(var(--r))}
.swamp .padb .lt{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:.8cqw;font:800 22px/1 var(--font-display);font-size:4.6cqw;color:#fff;text-shadow:0 .2cqw .2cqw rgba(10,50,20,.9),0 0 .8cqw rgba(10,50,20,.8),.2cqw 0 0 rgba(10,50,20,.8),-.2cqw 0 0 rgba(10,50,20,.8)}
.swamp .padb:hover .bob{filter:brightness(1.12)}
.swamp .padb.acc::after{content:"";position:absolute;right:6%;top:-4%;width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff4a8 0 22%,#ff7fc2 24% 62%,transparent 64%)}
.swamp .padb.good .bob svg{filter:drop-shadow(0 0 .9cqw #eaff8a) brightness(1.2) saturate(1.2)}
.swamp .padb.good .lt{color:#fff9b0}
.swamp .padb.bad{cursor:default}
.swamp .padb.bad .bob{transform:translateY(40%) scale(.7);opacity:.3;filter:grayscale(.8);animation:sink .8s ease-in forwards}
@keyframes padbob{from{transform:translateY(-1.5%)}to{transform:translateY(2.5%)}}
@keyframes sink{0%{transform:none;opacity:1;filter:none}30%{transform:translateY(8%) scale(.95)}100%{transform:translateY(40%) scale(.7);opacity:.3;filter:grayscale(.8)}}
.swamp .rip{position:absolute;left:var(--x);top:var(--y);width:90px;width:12cqw;height:44px;height:6cqw;margin:-22px 0 0 -45px;margin:-3cqw 0 0 -6cqw;border:.5cqw solid rgba(255,255,255,.75);border-radius:50%;pointer-events:none;z-index:2;animation:ripout .8s ease-out forwards}
.swamp .rip.bad{border-color:#0b2e24}
@keyframes ripout{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.swamp .ff{position:absolute;left:var(--x);top:var(--y);width:5px;width:.9cqw;height:5px;height:.9cqw;border-radius:50%;background:#f3ff8a;box-shadow:0 0 6px 2px rgba(230,255,110,.85);box-shadow:0 0 1.2cqw .5cqw rgba(230,255,110,.85);pointer-events:none;z-index:5;animation:ffmove var(--t) ease-in-out var(--d) infinite alternate,ffglow 1.8s ease-in-out var(--d) infinite}
@keyframes ffmove{0%{transform:translate(0,0)}50%{transform:translate(var(--dx),calc(var(--dy) * -.5))}100%{transform:translate(calc(var(--dx) * -.4),var(--dy))}}

function hang(c){
  if(!st||st.k!=="pantano"||st.locked||st.used[c])return;
  st.used[c]=1;var pd=document.querySelector('#sw .padb[data-c="'+c+'"]');
  if(st.word.indexOf(c)>=0){
    st.got[c]=1;st.last=c;tone([520]);
    if(pd)pd.classList.add("good");
    swRip(pd,"");swFrogs("ok");swSlots();
    if(st.word.split("").every(function(x){return st.got[x]})){$("sw").classList.add("won");win(true)}
  }else{
    st.lives--;st.tried=true;tone([200,150]);
    var tilde=st.word.split("").some(function(x){return x!==c&&norm(x)===c&&!st.got[x]});
    mood("sad");say(tilde?"¡Cuidado! Esa letra sí está, pero lleva tilde, diéresis o es otra letra.":"Esa letra no está.");
    if(pd)pd.classList.add("bad");
    swRip(pd,"bad");swFrogs("ko");swLives();
    if(st.lives<=0){
      st.locked=true;st.lost=true;swSlots();
      say("¡Jajaja! Era "+st.q[st.i][0]+".","b");mood("happy");
      setTimeout(nextQ,2400);
    }
  }
}

}
function addInk(card,k,isNew){var d=document.createElement("div");d.className="ink"+(isNew?" new":"");d.style.cssText="left:"+k.l+"%;top:"+k.t+"%;width:"+k.s+"px;height:"+k.s*.8+"px";card.appendChild(d)}
function shootInk(k){
  var card=$("ac");if(!card)return;
  var land=function(){var c=$("ac");if(c)addInk(c,k,true)};
  var av=$("av");
  if(!av.animate||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)){land();return}
  var a=av.getBoundingClientRect(),c=card.getBoundingClientRect();
  var sx=a.left+a.width/2-13,sy=a.top+a.height/2-13;
  var tx=c.left+c.width*k.l/100+k.s/2-13,ty=c.top+c.height*k.t/100+k.s*.4-13;
  var mx=(sx+tx)/2,my=Math.min(sy,ty)-70;
  av.animate([{transform:"none"},{transform:"translateX(-8px) scale(1.12,.88)",offset:.4},{transform:"none"}],{duration:300});
  var p=document.createElement("div");p.className="shot";document.body.appendChild(p);
  var tr=setInterval(function(){var r=p.getBoundingClientRect();var d=document.createElement("div");d.className="shot trail";d.style.left=(r.left+r.width/2-4)+"px";d.style.top=(r.top+r.height/2-4)+"px";document.body.appendChild(d);d.animate([{opacity:.8,transform:"scale(1)"},{opacity:0,transform:"scale(.2) translateY(14px)"}],{duration:420}).onfinish=function(){d.remove()}},45);
  var an=p.animate([
    {transform:"translate("+sx+"px,"+sy+"px) scale(.5)"},
    {transform:"translate("+mx+"px,"+my+"px) scale(1.1,.9)",offset:.5},
    {transform:"translate("+tx+"px,"+ty+"px) scale(1.5,.8)"}
  ],{duration:520,delay:130,easing:"cubic-bezier(.3,.1,.6,1)",fill:"both"});
  an.onfinish=function(){
    clearInterval(tr);p.remove();land();
    var c2=$("ac");if(c2&&c2.animate)c2.animate([{transform:"translate(0,0)"},{transform:"translate(-5px,3px)"},{transform:"translate(4px,-3px)"},{transform:"none"}],{duration:240});
  };
}
function answer(b){
  if(!at||at.locked)return;at.locked=true;
  var ok=b.dataset.c===at.cur[0];
  if(ok){
    b.classList.add("right");at.ok++;at.combo++;at.score+=10+(at.combo>=3?5:0);tone([600,800]);mood("happy");say("¡Bien! "+at.cur[0],"p");
    setTimeout(function(){if(at){at.i++;attackQ()}},400);
  }else{
    b.classList.add("no");at.lives--;at.combo=0;tone([200,150]);
    at.ink.push({l:Math.round(5+Math.random()*60),t:Math.round(5+Math.random()*60),s:Math.round(90+Math.random()*80)});shootInk(at.ink[at.ink.length-1]);
    mood("happy");say("¡Jajaja! Se escribe "+at.cur[0]+". ¡Una mancha más!","b");
    document.querySelectorAll("#ac .opt").forEach(function(x){if(x.dataset.c===at.cur[0])x.classList.add("right")});
    setTimeout(function(){if(!at)return;if(at.lives<=0)attackEnd();else{at.i++;attackQ()}},900);
  }
}
function attackEnd(){
  if(!at)return;clearInterval(at.timer);
  var sc=at.score,ok=at.ok,s=ok>=12?3:ok>=7?2:1,rec=sc>(save.attack||0);
  if(rec){save.attack=sc;persist()}
  at=null;mood(ok>=7?"sad":"happy");tone(ok>=7?[523,659,784]:[300,260]);
  say(ok>=7?"¡Me ganaste! Escribes muy bien.":"¡Jajaja! Esta vez gané yo. ¿Revancha?","b");
  show('<div class="card">'+bigStars(s)+'<div class="score">'+sc+' puntos · '+ok+' palabras bien'+(rec?'<br>¡Nuevo récord!':'')+'</div><div class="btns"><button class="ghost primary" id="nx">Revancha</button><button class="ghost" id="back">Menú</button></div></div>');
  $("nx").onclick=attack;$("back").onclick=home;
}

try{if(window.speechSynthesis)speechSynthesis.getVoices()}catch(e){}
home();
</script>
